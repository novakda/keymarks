[package]
name = "powermarks"
version = "0.1.0"
edition = "2024"
description = "Powermarks 2026: keyword bookmark manager"

[dependencies]
pm35 = { version = "0.1.0", path = "../pm35" }
serde = { version = "1.0.229", features = ["derive"] }
store = { path = "../store" }
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"

[build-dependencies]
tauri-build = "2.7.4"
