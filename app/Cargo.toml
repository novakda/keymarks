[package]
name = "keymarks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keymarks: a keyword-first bookmark manager"

[dependencies]
futures = "0.3.34"
html-escape = "0.3.0"
httpdate = "1.0.3"
pm35 = { version = "0.1.0", path = "../pm35" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
store = { path = "../store" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.1", features = ["sync"] }

[build-dependencies]
tauri-build = "2.7.4"
