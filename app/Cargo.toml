[package]
name = "keymarks"
version = "0.1.0"
edition = "2024"
description = "Keymarks: a keyword-first bookmark manager"

[dependencies]
pm35 = { version = "0.1.0", path = "../pm35" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
store = { path = "../store" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"

[build-dependencies]
tauri-build = "2.7.4"
