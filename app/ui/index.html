<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Powermarks</title>
<style>
  :root { --bg: #fff; --panel: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --sel: #dbe4ff; --cursor: #60679f; --accent: #60679f; --danger: #c0392b; --chip: #e8eaf6; --tag: #c99a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --panel: #232325; --fg: #f2f2f7; --muted: #98989d; --line: #2c2c2e; --sel: #2f3a66; --cursor: #9aa2e0; --accent: #9aa2e0; --danger: #e5675a; --chip: #343a5c; --tag: #e8c14a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg); display: grid; grid-template: auto 1fr auto / 220px 1fr 340px; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
  input, textarea, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 100%; }
  #q { flex: 1; font-size: 16px; padding: 8px 10px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  button.secondary { background: transparent; color: var(--fg); border-color: var(--line); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  button.icon { padding: 4px 8px; }
  button:disabled { opacity: .45; cursor: default; }
  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }

  /* keyword panel */
  nav { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
  nav h2 { font-size: 12px; font-weight: 600; margin: 8px 10px 4px; color: var(--muted); }
  nav .tools { padding: 0 8px 6px; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  nav .tools input[type=checkbox] { width: auto; margin: 0 4px 0 0; vertical-align: -2px; }
  #kwlist { flex: 1; }
  #kwlist li { display: flex; gap: 6px; padding: 2px 10px; cursor: default; user-select: none; content-visibility: auto; contain-intrinsic-size: auto 22px; }
  #kwlist li:hover, #kwlist li.active { background: var(--sel); }
  #kwlist .n { margin-left: auto; color: var(--muted); font-size: 12px; }
  .tagmark { color: var(--tag); width: 1em; }

  /* bookmark list */
  #list { border-right: 1px solid var(--line); }
  #list li { padding: 6px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; cursor: default; user-select: none; }
  #list li.sel { background: var(--sel); }
  #list li.cursor { border-left-color: var(--cursor); }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* properties */
  aside { background: var(--panel); padding: 12px; overflow-y: auto; }
  aside label { display: block; margin: 10px 0 3px; font-size: 12px; color: var(--muted); }
  aside textarea { height: 64px; resize: vertical; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: text; }
  .tags:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 8px; border-radius: 12px; background: var(--chip); font-size: 13px; }
  .chip button { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 14px; line-height: 1; }
  .chip button:hover { color: var(--danger); }
  .tags input { flex: 1; min-width: 90px; border: 0; padding: 3px 4px; outline: none; background: transparent; }
  .label-row { display: flex; align-items: end; justify-content: space-between; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .info { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .hint { color: var(--muted); }
  footer { grid-column: 1 / -1; padding: 4px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

  #ctx { position: fixed; z-index: 10; min-width: 170px; padding: 4px 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
  #ctx strong { display: block; padding: 4px 12px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  #ctx button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; color: var(--fg); padding: 5px 12px; }
  #ctx button:hover, #ctx button:focus-visible { background: var(--sel); outline: none; }
  #ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  dialog { width: min(640px, 92vw); max-height: 86vh; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog form { display: flex; flex-direction: column; max-height: 86vh; }
  dialog h2 { margin: 0; padding: 14px 16px 4px; font-size: 16px; }
  dialog .intro { margin: 0; padding: 0 16px 10px; color: var(--muted); font-size: 13px; }
  #cleanup-groups { overflow-y: auto; padding: 0 16px; border-block: 1px solid var(--line); }
  #cleanup-groups details { border-bottom: 1px solid var(--line); padding: 6px 0; }
  #cleanup-groups summary { cursor: pointer; }
  #cleanup-groups summary .n { color: var(--muted); font-size: 12px; }
  #cleanup-groups ul { max-height: 240px; overflow-y: auto; margin: 6px 0 0 22px; font-size: 13px; }
  #cleanup-groups li { content-visibility: auto; contain-intrinsic-size: auto 20px; }
  #cleanup-groups li .n { color: var(--muted); }
  dialog input[type=checkbox] { width: auto; margin-right: 6px; vertical-align: -2px; }
  dialog .row { justify-content: flex-end; padding: 12px 16px; margin: 0; }
  @media (max-width: 900px) { body { grid-template-columns: 180px 1fr 300px; } }
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Type keywords…" autofocus aria-label="Search bookmarks">
  <button id="import" hidden>Import pm35.htm…</button>
</header>

<nav aria-label="Keyword dictionary">
  <h2 id="kw-head">Keywords</h2>
  <div class="tools">
    <input id="kw-filter" type="search" placeholder="Find keyword…" aria-label="Find keyword">
    <label><input id="kw-tagged" type="checkbox">Tagged only</label>
    <button id="cleanup-open" type="button" class="secondary">Clean up keywords…</button>
  </div>
  <ul id="kwlist" aria-label="Keywords"></ul>
</nav>
<ul id="list" role="listbox" aria-label="Bookmarks" aria-multiselectable="true" tabindex="0"></ul>
<aside id="panel" aria-label="Bookmark properties"></aside>
<footer id="status" aria-live="polite"></footer>

<div id="ctx" role="menu" hidden>
  <strong id="ctx-title"></strong>
  <button role="menuitem" data-act="search">Search</button>
  <button role="menuitem" data-act="add">Add to search</button>
  <hr>
  <button role="menuitem" data-act="tag">Tag keyword</button>
  <button role="menuitem" data-act="rename">Rename…</button>
  <button role="menuitem" data-act="delete">Delete from all bookmarks…</button>
</div>

<datalist id="kw-options"></datalist>

<dialog id="cleanup" aria-labelledby="cleanup-title">
  <form method="dialog">
    <h2 id="cleanup-title">Clean up keywords</h2>
    <p class="intro">Review what will be removed or merged; click a group to show or hide its keywords. Tagged keywords are never touched. A backup of the whole database is saved first.</p>
    <div id="cleanup-groups"></div>
    <div class="row">
      <button value="cancel" class="secondary">Cancel</button>
      <button id="cleanup-apply" value="apply" type="button">Apply</button>
    </div>
  </form>
</dialog>

<template id="edit-form">
  <form id="form">
    <label for="f-title">Title</label><input id="f-title" name="title" required>
    <label for="f-url">URL</label><input id="f-url" name="url" required>
    <div class="label-row">
      <label for="f-kw">Keywords</label>
      <button id="kw-sort" type="button" class="secondary icon" title="Sort keywords A→Z" aria-label="Sort keywords A to Z">A→Z</button>
    </div>
    <div class="tags" id="f-tags">
      <input id="f-kw" list="kw-options" placeholder="Add keyword…" autocomplete="off">
    </div>
    <label for="f-description">Description</label><textarea id="f-description" name="description"></textarea>
    <label for="f-notes">Notes</label><textarea id="f-notes" name="notes"></textarea>
    <label for="f-rating">Rating</label>
    <select id="f-rating" name="rating"></select>
    <div class="row">
      <button id="save" type="submit" disabled>Save (Ctrl+S)</button>
      <button id="revert" type="button" class="secondary" disabled>Revert</button>
      <button id="del-one" type="button" class="danger">Delete</button>
    </div>
    <div class="info" id="info"></div>
  </form>
</template>

<script src="app.js"></script>
</body>
</html>
