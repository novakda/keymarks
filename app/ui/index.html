<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Powermarks</title>
<style>
  :root { --bg: #fff; --panel: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --sel: #dbe4ff; --cursor: #60679f; --accent: #60679f; --danger: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --panel: #232325; --fg: #f2f2f7; --muted: #98989d; --line: #2c2c2e; --sel: #2f3a66; --cursor: #9aa2e0; --accent: #9aa2e0; --danger: #e5675a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg); display: grid; grid-template: auto 1fr auto / 1fr 340px; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
  input, textarea, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 100%; }
  #q { flex: 1; font-size: 16px; padding: 8px 10px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  button.secondary { background: transparent; color: var(--fg); border-color: var(--line); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .45; cursor: default; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; border-right: 1px solid var(--line); }
  li { padding: 6px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; cursor: default; user-select: none; }
  li.sel { background: var(--sel); }
  li.cursor { border-left-color: var(--cursor); }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside { background: var(--panel); padding: 12px; overflow-y: auto; }
  aside label { display: block; margin: 10px 0 3px; font-size: 12px; color: var(--muted); }
  aside textarea { height: 64px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .info { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .hint { color: var(--muted); }
  footer { grid-column: 1 / -1; padding: 4px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  @media (max-width: 720px) { body { grid-template: auto 1fr auto auto / 1fr; } aside { max-height: 45vh; } #list { border-right: 0; } }
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Type keywords…" autofocus aria-label="Search bookmarks">
  <button id="import" hidden>Import pm35.htm…</button>
</header>
<ul id="list" role="listbox" aria-label="Bookmarks" aria-multiselectable="true" tabindex="0"></ul>
<aside id="panel" aria-label="Bookmark properties"></aside>
<footer id="status" aria-live="polite"></footer>

<template id="edit-form">
  <form id="form">
    <label for="f-title">Title</label><input id="f-title" name="title" required>
    <label for="f-url">URL</label><input id="f-url" name="url" required>
    <label for="f-keywords">Keywords</label><input id="f-keywords" name="keywords">
    <label for="f-description">Description</label><textarea id="f-description" name="description"></textarea>
    <label for="f-notes">Notes</label><textarea id="f-notes" name="notes"></textarea>
    <label for="f-rating">Rating</label>
    <select id="f-rating" name="rating"></select>
    <div class="row">
      <button id="save" type="submit" disabled>Save (Ctrl+S)</button>
      <button id="revert" type="button" class="secondary" disabled>Revert</button>
      <button id="del-one" type="button" class="danger">Delete</button>
    </div>
    <div class="info" id="info"></div>
  </form>
</template>

<script src="app.js"></script>
</body>
</html>
