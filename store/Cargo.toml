[package]
name = "store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SQLite bookmark store with Powermarks import"

[dependencies]
html-escape = "0.3.0"
pm35 = { path = "../pm35" }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
